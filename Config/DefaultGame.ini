; 코드가 경로 문자열로만 부르는 에셋(LoadClass)은 쿠커에게 참조로 보이지 않아 빠진다.
; 10/12 패키징에서 BP_NeonDistrictCharacter 와 BP_NeonDistrictPlayerController 가 이렇게 누락돼
; 패키징된 게임이 엔진 기본 폰.컨트롤러로 돌았다. 두 폴더를 통째로 쿠킹 대상에 넣어 막는다
+DirectoriesToAlwaysCook=(Path="/Game/NeonDistrict")
+DirectoriesToAlwaysCook=(Path="/Game/Variant_Shooter")
; C++ 생성자에서 지정한 경로는 TSoftObjectPtr 라도 쿠커가 모른다 - C++ 클래스의 CDO 는
; 에셋이 아니라서 에셋 레지스트리가 훑지 않는다. 블루프린트에서 지정한 것만 참조로 잡힌다.
; 무기 클래스들이 생성자에서 총 메시를 지정하므로 그 폴더를 명시한다
+DirectoriesToAlwaysCook=(Path="/Game/Fab")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")

